name: build

on: [push]

jobs:
  engine-build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      working-directory: ./

    steps:
    - uses: actions/checkout@v4
    - name: install numa
      if: runner.os == 'Linux'
      run: sudo apt-get install libnuma-dev -y
    - name: install nshogi
      run: |
        git clone https://github.com/nyashiki/nshogi.git
        cd nshogi && sudo make install
    - name: ldconfig
      if: runner.os == 'Linux'
      run: sudo ldconfig
    - name: make engine, selfplay and bench
      working-directory: ${{ env.working-directory }}
      run: make -j"$(getconf _NPROCESSORS_ONLN)" NUMA_ENABLED=1 EXECUTOR=random engine selfplay bench
    - name: usi smoke test
      if: runner.os == 'Linux'
      working-directory: ${{ env.working-directory }}
      run: |
        {
          printf "usi\n"
          sleep 1
          printf "setoption name USI_Hash value 1024\n"
          printf "setoption name EvalCacheMemoryMB value 128\n"
          printf "isready\n"
          sleep 5
          printf "position startpos\n"
          printf "go movetime 2000\n"
          sleep 4
          printf "quit\n"
        } | timeout 120 ./build/release_clang++/nshogi-engine | tee usi_smoke.log
        grep -q "readyok" usi_smoke.log
        grep -q "bestmove" usi_smoke.log
